name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs Bun from mise.toml — single source of truth for the toolchain version.
      - uses: jdx/mise-action@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck Worker (strict — enforces no `any`/`unknown`)
        run: bun run typecheck

      - name: Typecheck Svelte UI
        run: bun run check:svelte

      - name: Lint + format check (Biome)
        run: bun run ci

      - name: Tests
        run: bun test

      - name: Build the SPA
        run: bun run build

      # Validate with the SAME wrangler the deploy job uses (the locked v4 from node_modules).
      # --autoconfig=false: we build the SPA ourselves (Vite); skip wrangler's framework detection.
      - name: Build for Workers (proves it deploys)
        run: bunx --bun wrangler deploy --dry-run --autoconfig=false

  # Deploy to Cloudflare on pushes to main, only after `check` passes.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the SPA
        run: bun run build

      - name: Deploy to Cloudflare Workers
        run: bunx --bun wrangler deploy --autoconfig=false
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
